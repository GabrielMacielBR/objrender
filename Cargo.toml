[package]
name = "objrender"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Offline 3D object-based spatial audio renderer for arbitrary speaker layouts"
repository = "https://github.com/GabrielMacielBR/objrender"

[dependencies]
pulp = { version = "0.22", features = ["x86-v4"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
approx = "0.5"
criterion = "0.8"
hound = "3.5"
proptest = "1"

[[bench]]
name = "dsp_kernels"
harness = false
